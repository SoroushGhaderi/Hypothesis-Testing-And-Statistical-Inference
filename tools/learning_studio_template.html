<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A visual, concept-first course in hypothesis testing and statistical inference.">
  <title>Hypothesis Testing · Learning Studio</title>
  <style>
__COURSE_CSS__
  </style>
</head>
<body class="studio_shell">
  <a class="skip_link" href="#course_content">Skip to course content</a>
  <header class="app_header">
    <div class="brand"><span class="brand_mark">H₀</span><span>Inference Learning Studio</span></div>
    <div class="course_progress" aria-label="Course progress">
      <div class="progress_label"><span>Course progress</span><span id="progress_text">0 of 15 lessons</span></div>
      <div class="progress_track"><div class="progress_fill" id="progress_fill"></div></div>
    </div>
    <div class="header_actions">
      <label class="language_control" for="language_select"><span data-i18n="language">Language</span>
        <select id="language_select" aria-label="Language"><option value="en">English</option><option value="fa">فارسی</option></select>
      </label>
      <button class="icon_button" id="theme_button" type="button" aria-label="Toggle high contrast">◐</button>
      <button class="icon_button menu_button" id="menu_button" type="button" aria-label="Open course navigation">☰</button>
    </div>
  </header>
  <div class="course_layout">
    <aside class="course_sidebar" id="course_navigation">
      <div class="search_box"><input id="course_search" type="search" placeholder="Find a lesson or topic" aria-label="Search course navigation"></div>
      <nav aria-label="Course navigation">__NAVIGATION__</nav>
      <p class="empty_search" id="empty_search">No matching pages.</p>
    </aside>
    <main class="course_main" id="course_content">__ARTICLES__</main>
  </div>
  <script>
    const pageOrder = __PAGE_ORDER__;
    const pages = [...document.querySelectorAll('.course_page')];
    const links = [...document.querySelectorAll('.nav_link')];
    const lessonChecks = [...document.querySelectorAll('[data-progress]')];
    const progressKey = 'hypothesis_testing_course_progress_v2';
    const languageKey = 'hypothesis_testing_course_language_v1';
    const uiEnglish = {
      language: 'Language', skip: 'Skip to course content', progress: 'Course progress',
      search: 'Find a lesson or topic', searchLabel: 'Search course navigation',
      noMatches: 'No matching pages.', theme: 'Toggle high contrast', menu: 'Open course navigation',
      complete: 'Mark lesson complete'
    };
    const uiPersian = {
      language: 'زبان', skip: 'رفتن به محتوای دوره', progress: 'پیشرفت دوره',
      search: 'جست‌وجوی درس یا موضوع', searchLabel: 'جست‌وجو در ناوبری دوره',
      noMatches: 'صفحه‌ای پیدا نشد.', theme: 'تغییر کنتراست بالا', menu: 'باز کردن راهبری دوره',
      complete: 'علامت‌گذاری به‌عنوان درس کامل‌شده'
    };
    const translations = __FA_TRANSLATIONS__;
    function collectTranslatable(root) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue.trim() || node.parentElement.closest('script, style, .term, select, option, .brand_mark')) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      const result = []; let node;
      while ((node = walker.nextNode())) { if (!node._englishText) node._englishText = node.nodeValue; result.push(node); }
      return result;
    }
    function localizeTree(root, language) {
      const nodes = collectTranslatable(root);
      nodes.forEach(node => {
        if (language === 'en') { node.nodeValue = node._englishText; return; }
        const original = node._englishText, trimmed = original.trim(), translated = translations[trimmed];
        if (translated === undefined) return;
        const prefix = original.match(/^\s*/)[0], suffix = original.match(/\s*$/)[0];
        node.nodeValue = prefix + translated + suffix;
      });
    }
    function localizeAttributes(root, language) {
      const elements = [root, ...root.querySelectorAll('[aria-label], [title], [placeholder], [alt]')];
      elements.forEach(element => {
        if (!element?.getAttribute) return;
        ['aria-label', 'title', 'placeholder', 'alt'].forEach(attribute => {
          const value = element.getAttribute(attribute);
          if (value === null) return;
          const key = '_english_' + attribute.replace('-', '_');
          if (!element[key]) element[key] = value;
          const original = element[key];
          element.setAttribute(attribute, language === 'fa' ? (translations[original.trim()] || original) : original);
        });
      });
    }
    function setLocalizedControls(language) {
      const strings = language === 'fa' ? uiPersian : uiEnglish;
      document.documentElement.lang = language;
      document.documentElement.dir = language === 'fa' ? 'rtl' : 'ltr';
      document.querySelector('.skip_link').textContent = strings.skip;
      document.querySelector('.progress_label span:first-child').textContent = strings.progress;
      document.querySelector('.search_box input').placeholder = strings.search;
      document.querySelector('.search_box input').setAttribute('aria-label', strings.searchLabel);
      document.querySelector('.empty_search').textContent = strings.noMatches;
      document.querySelector('[data-i18n="language"]').textContent = strings.language;
      document.getElementById('theme_button').setAttribute('aria-label', strings.theme);
      document.getElementById('menu_button').setAttribute('aria-label', strings.menu);
      document.querySelectorAll('.lesson_complete').forEach(label => { label.lastChild.textContent = ` ${strings.complete}`; });
      document.querySelectorAll('.page_nav').forEach(nav => nav.setAttribute('aria-label', language === 'fa' ? 'راهبری درس' : 'Lesson navigation'));
      const description = document.querySelector('meta[name="description"]');
      if (description) {
        if (!description._englishDescription) description._englishDescription = description.content;
        description.content = language === 'fa' ? (translations[description._englishDescription.trim()] || description._englishDescription) : description._englishDescription;
      }
      const selected = document.querySelector('.course_page.active');
      if (selected) {
        if (!selected._englishTitle) selected._englishTitle = selected.dataset.title;
        const navTitle = document.querySelector('.nav_link[data-page="' + selected.id + '"] span:last-child');
        selected.dataset.title = navTitle?.textContent || selected._englishTitle;
      }
      document.querySelectorAll('.nav_link').forEach(link => { link.dataset.search = link.textContent.toLowerCase(); });
      document.title = `${titleFor(selected?.id || 'course_overview')} · ${language === 'fa' ? 'استودیوی یادگیری' : 'Learning Studio'}`;
    }
    let activeLanguage = 'en';
    function setLanguage(language) {
      activeLanguage = language;
      document.querySelectorAll('.course_page').forEach(page => { if (!page._englishTitle) page._englishTitle = page.dataset.title; });
      document.querySelectorAll('.nav_link').forEach(link => { if (!link._englishSearch) link._englishSearch = link.dataset.search; });
      if (language === 'fa') {
        localizeTree(document.querySelector('.course_sidebar'), 'fa');
        localizeTree(document.querySelector('.app_header'), 'fa');
        localizeTree(document.querySelector('.course_page.active'), 'fa');
        localizeAttributes(document.body, 'fa');
        setLocalizedControls('fa');
        document.querySelectorAll('.nav_link').forEach(link => { link.dataset.search = link.textContent.toLowerCase(); });
        buildPageNavigation();
        localizeTree(document.querySelector('.course_page.active .page_nav'), 'fa');
      } else {
        document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr';
        document.querySelectorAll('body *').forEach(element => {
          [...element.childNodes].filter(node => node.nodeType === Node.TEXT_NODE && node._englishText).forEach(node => node.nodeValue = node._englishText);
        });
        document.querySelectorAll('.course_page').forEach(page => { page.dataset.title = page._englishTitle; });
        document.querySelectorAll('.nav_link').forEach(link => { link.dataset.search = link._englishSearch; });
        localizeAttributes(document.body, 'en');
        setLocalizedControls('en'); buildPageNavigation();
      }
      try { localStorage.setItem(languageKey, language); } catch (error) { /* Language remains active for this visit. */ }
      updateProgress();
    }
    function titleFor(id) {
      if (activeLanguage === 'fa') {
        const navTitle = document.querySelector('.nav_link[data-page="' + id + '"] span:last-child');
        if (navTitle) return navTitle.textContent;
      }
      const page = document.getElementById(id); return page ? (page._englishTitle || page.dataset.title) : id;
    }
    function updateProgress() {
      const completed = lessonChecks.filter(item => item.checked).length;
      document.getElementById('progress_text').textContent = activeLanguage === 'fa'
        ? `${completed} از ${lessonChecks.length} درس`
        : `${completed} of ${lessonChecks.length} lessons`;
      document.getElementById('progress_fill').style.width = `${lessonChecks.length ? completed / lessonChecks.length * 100 : 0}%`;
      try { localStorage.setItem(progressKey, JSON.stringify(lessonChecks.filter(item => item.checked).map(item => item.dataset.progress))); } catch (error) { /* Progress still works for this session. */ }
    }
    function buildPageNavigation() {
      pages.forEach(page => {
        const index = pageOrder.indexOf(page.id), previous = pageOrder[index - 1], next = pageOrder[index + 1];
        const nav = page.querySelector('.page_nav');
        const previousLink = previous ? `<a href="#${previous}"><small>${activeLanguage === 'fa' ? 'قبلی' : 'Previous'}</small><strong>${titleFor(previous)}</strong></a>` : '';
        const nextLink = next ? `<a href="#${next}"><small>${activeLanguage === 'fa' ? 'بعدی' : 'Next'}</small><strong>${titleFor(next)}</strong></a>` : '';
        nav.innerHTML = previousLink + nextLink;
      });
    }
    function showPage() {
      let id = location.hash.slice(1) || pageOrder[0];
      if (!pageOrder.includes(id)) id = pageOrder[0];
      pages.forEach(page => page.classList.toggle('active', page.id === id));
      links.forEach(link => { const active = link.dataset.page === id; link.classList.toggle('active', active); active ? link.setAttribute('aria-current', 'page') : link.removeAttribute('aria-current'); });
      const activeGroup = document.querySelector(`.nav_link[data-page="${id}"]`)?.closest('.nav_level');
      if (activeGroup) activeGroup.open = true;
      document.title = `${titleFor(id)} · ${activeLanguage === 'fa' ? 'استودیوی یادگیری' : 'Learning Studio'}`;
      document.body.classList.remove('nav_open');
      window.scrollTo({ top: 0, behavior: 'instant' });
      if (activeLanguage === 'fa') setTimeout(() => setLanguage('fa'), 0);
    }
    let saved = new Set();
    try { saved = new Set(JSON.parse(localStorage.getItem(progressKey) || '[]')); } catch (error) { /* Reading remains available when storage is disabled. */ }
    lessonChecks.forEach(item => { item.checked = saved.has(item.dataset.progress); item.addEventListener('change', updateProgress); });
    document.getElementById('course_search').addEventListener('input', event => {
      const query = event.target.value.trim().toLowerCase(); let visible = 0;
      links.forEach(link => { const match = !query || link.dataset.search.includes(query); link.classList.toggle('hidden', !match); if (match) visible += 1; });
      document.querySelectorAll('.nav_level').forEach(group => {
        group.hidden = !!query && !group.querySelector('.nav_link:not(.hidden)');
        if (query && !group.hidden) group.open = true;
      });
      document.getElementById('empty_search').style.display = visible ? 'none' : 'block';
    });
    document.getElementById('menu_button').addEventListener('click', () => document.body.classList.toggle('nav_open'));
    document.getElementById('theme_button').addEventListener('click', () => document.body.classList.toggle('high_contrast'));
    document.getElementById('language_select').addEventListener('change', event => setLanguage(event.target.value));
    window.addEventListener('hashchange', showPage);
    buildPageNavigation(); updateProgress(); showPage();
    let savedLanguage = 'en';
    try { savedLanguage = localStorage.getItem(languageKey) || 'en'; } catch (error) { /* English remains the default when storage is disabled. */ }
    document.getElementById('language_select').value = savedLanguage;
    if (savedLanguage === 'fa') setLanguage('fa');
  </script>
</body>
</html>
