<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Course image previews · Lessons 1–5</title>
<style>
:root { color-scheme:light; --canvas:#f4f6fa; --surface:#fff; --ink:#1b2b40; --muted:#52647a; --line:#d9e2ed; --focus:#94621f; }
:root[data-theme="dark"] { color-scheme:dark; --canvas:#101823; --surface:#192433; --ink:#e7edf5; --muted:#b6c4d5; --line:#748aa3; --focus:#f0be75; }
* { box-sizing:border-box; }
body { margin:0; background:var(--canvas); color:var(--ink); font:16px/1.6 "Avenir Next","Segoe UI",Arial,sans-serif; }
main { max-width:1024px; margin:auto; padding:32px 20px 64px; }
header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px; }
h1 { margin:0; font-size:clamp(26px,4vw,38px); line-height:1.2; }
.intro { max-width:65ch; margin:10px 0 0; color:var(--muted); }
button { min-height:44px; padding:8px 16px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit; cursor:pointer; }
button[aria-pressed="true"] { border-color:#8dc4f0; }
:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
figure { margin:0 0 32px; overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
img { display:block; width:100%; height:auto; background:#f8f5ee; }
figcaption { padding:18px 22px; }
h2 { margin:0 0 6px; font-size:21px; line-height:1.3; }
figcaption p { margin:0; max-width:70ch; color:var(--muted); }
@media(max-width:440px) { main { padding:24px 12px 40px; } figcaption { padding:16px; } h2 { font-size:18px; } }
</style>
</head>
<body>
<main>
<header><div><h1>Course image previews</h1><p class="intro">Lessons 1–5 · One idea per image, with a shared paper-and-ink style. These are schematic concept illustrations. Open an image to inspect it at full size.</p></div><button aria-pressed="false" id="theme" type="button">Night mode</button></header>
<figure><a href="lesson_01_two_sided_p_value.png" rel="noopener" target="_blank"><img alt="A symmetric null distribution has matching shaded outer tails beyond two equally extreme thresholds; the right threshold marks the observed statistic." height="1024" src="lesson_01_two_sided_p_value.png" width="1536"/></a><figcaption><h2>1 · A two-sided p-value</h2><p>Under the assumed null model, both equally extreme tails contribute to the two-sided p-value. Schematic illustration.</p></figcaption></figure>
<figure><a href="lesson_02_power_and_detection.png" rel="noopener" target="_blank"><img alt="An alternative distribution is divided by a decision boundary into a smaller missed-effect area and a larger detection area." height="1024" src="lesson_02_power_and_detection.png" width="1536"/></a><figcaption><h2>2 · Power and detection</h2><p>For a specified alternative and testing procedure, outcomes beyond the decision boundary are detections; the remaining outcomes are misses. One-sided schematic.</p></figcaption></figure>
<figure><a href="lesson_03_mean_interval_and_benchmark.png" rel="noopener" target="_blank"><img alt="An estimate and its horizontal uncertainty interval are entirely to the right of a separate benchmark line." height="1024" src="lesson_03_mean_interval_and_benchmark.png" width="1536"/></a><figcaption><h2>3 · A mean interval and a benchmark</h2><p>The interval describes uncertainty about the population mean, not the spread of individual ages. This schematic shows an interval entirely above a teaching benchmark.</p></figcaption></figure>
<figure><a href="lesson_04_independent_groups.png" rel="noopener" target="_blank"><img alt="Two separate groups contain distinct record marks; none is connected or repeated across groups." height="1024" src="lesson_04_independent_groups.png" width="1536"/></a><figcaption><h2>4 · Independent groups</h2><p>Each record belongs to one comparison group. Group labels do not create pairing. Schematic records.</p></figcaption></figure>
<figure><a href="lesson_05_paired_measurements.png" rel="noopener" target="_blank"><img alt="Five lines connect five earlier measurements to their matching later measurements, preserving each unit's identity." height="1024" src="lesson_05_paired_measurements.png" width="1536"/></a><figcaption><h2>5 · Paired measurements</h2><p>Each line connects two measurements from the same unit. The paired analysis studies within-unit change. Schematic records, not the eleven observed firms.</p></figcaption></figure>
</main>
<script>
const root=document.documentElement;
const button=document.getElementById('theme');
function setTheme(dark) { root.dataset.theme=dark?'dark':'light'; button.setAttribute('aria-pressed',String(dark)); }
setTheme(matchMedia('(prefers-color-scheme: dark)').matches);
button.addEventListener('click',()=>setTheme(root.dataset.theme!=='dark'));
</script>
</body>
</html>
